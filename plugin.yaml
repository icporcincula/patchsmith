name: patchsmith
version: "0.1.0"
description: "Proposes or applies one bounded local-model coding task, with guarded application of reviewed patches."
author: "Bart Porcincula"
requires_hermes: ">=0.23.0"
provides_tools:
  - implement_task
  - apply_patch
requires_env:
  - name: PS_ENDPOINT
    description: "Local OpenAI-compatible API base."
    required: false
  - name: PS_MODEL
    description: "Local model identifier."
    required: false
  - name: PS_MAX_TURNS
    description: "Default maximum model turns."
    required: false
  - name: PS_CTX_BUDGET
    description: "Default context budget."
    required: false
  - name: PS_TEST_COMMAND
    description: "User-authorized test command."
    required: false
