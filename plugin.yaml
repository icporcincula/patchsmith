name: local-implementer
version: "0.1.0"
description: "Implements one coding task through a bounded local-model tool loop and returns the patch."
author: "Bart Porcincula"
requires_hermes: ">=0.23.0"
provides_tools:
  - implement_task
requires_env:
  - name: LI_ENDPOINT
    description: "Local OpenAI-compatible API base."
    required: false
  - name: LI_MODEL
    description: "Local model identifier."
    required: false
  - name: LI_MAX_TURNS
    description: "Default maximum model turns."
    required: false
  - name: LI_CTX_BUDGET
    description: "Default context budget."
    required: false
  - name: LI_TEST_COMMAND
    description: "User-authorized test command."
    required: false
